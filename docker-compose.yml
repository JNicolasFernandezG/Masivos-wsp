services:
  waha:
    build:
      context: .
      dockerfile: Dockerfile.waha
      args:
        WAHA_IMAGE: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    container_name: masivos-waha
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/node:rw,noexec,nosuid,uid=1000,gid=1000,size=16m
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_API_KEY=${WAHA_API_KEY:-cambia_esta_api_key_segura}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-cambia_esta_password}
      - WHATSAPP_START_SESSION=${WAHA_SESSION:-default}
      - WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL:-http://app:4000/api/webhooks/waha}
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY:-}
      - WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC=false
      - WAHA_CLIENT_DEVICE_NAME=${WAHA_CLIENT_DEVICE_NAME:-Asistodo}
      - WAHA_CLIENT_BROWSER_NAME=${WAHA_CLIENT_BROWSER_NAME:-Desktop}
      - GODEBUG=netdns=go
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - masivos_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masivos-app
    restart: unless-stopped
    depends_on:
      - waha
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/masivos.db
      - WAHA_BASE_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY:-cambia_esta_api_key_segura}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY:-}
      - WAHA_TIMEOUT_MS=${WAHA_TIMEOUT_MS:-60000}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-549}
      - DEFAULT_MESSAGE_TEMPLATE=${DEFAULT_MESSAGE_TEMPLATE:-}
      - WORKER_MIN_DELAY_MS=${WORKER_MIN_DELAY_MS:-20000}
      - WORKER_MAX_DELAY_MS=${WORKER_MAX_DELAY_MS:-60000}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-3000}
      - WORKER_CHUNK_SIZE=${WORKER_CHUNK_SIZE:-25}
      - WORKER_CHUNK_PAUSE_MIN_MS=${WORKER_CHUNK_PAUSE_MIN_MS:-2700000}
      - WORKER_CHUNK_PAUSE_MAX_MS=${WORKER_CHUNK_PAUSE_MAX_MS:-3600000}
      - WORKER_DAILY_LIMIT=${WORKER_DAILY_LIMIT:-125}
      - WORKER_SUGGESTED_BATCH_SIZE=${WORKER_SUGGESTED_BATCH_SIZE:-25}
      - WORKER_MAX_BATCH_SIZE=${WORKER_MAX_BATCH_SIZE:-1000}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - BUSINESS_HOURS_ENABLED=${BUSINESS_HOURS_ENABLED:-true}
      - BUSINESS_HOURS_START=${BUSINESS_HOURS_START:-09:00}
      - BUSINESS_HOURS_END=${BUSINESS_HOURS_END:-19:00}
      - BUSINESS_ALLOWED_DAYS=${BUSINESS_ALLOWED_DAYS:-1,2,3,4,5,6}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${APP_BIND_HOST:-${CADDY_BIND_HOST:-0.0.0.0}}:${APP_PORT:-${CADDY_PORT:-8084}}:4000"
    volumes:
      - ./data/app:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - masivos_net

networks:
  masivos_net:
    driver: bridge

volumes:
  waha_sessions:
  waha_media:
