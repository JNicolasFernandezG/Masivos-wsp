name: CI/CD - Verificar y Desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_verify:
        description: 'Saltar tests de CI y desplegar directo en Linux'
        required: false
        default: false
        type: boolean

jobs:
  verify:
    name: CI - Typecheck, tests, build y Docker
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Ejecutar suite de pruebas
        run: npm test

      - name: Compilar proyecto
        run: npm run build

      - name: Validar docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      - name: Probar build de imagen Docker (app y waha)
        run: |
          docker build -t masivos-wsp-app:ci .
          docker build -t masivos-wsp-waha:ci -f Dockerfile.waha .

  deploy:
    name: CD - Desplegar en servidor Linux (Self-Hosted)
    needs: verify
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (
        needs.verify.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.skip_verify && needs.verify.result == 'skipped')
      )
    runs-on: self-hosted
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Desplegar con Docker Compose y .env efímero
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/masivos-wsp' }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_PROD" ]; then
            echo "[deploy] ERROR: el secreto ENV_PROD no está configurado o está vacío." >&2
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "[deploy] ERROR: no se encontró el repositorio Git en $DEPLOY_PATH (ajusta la variable DEPLOY_PATH si usas otra ruta)." >&2
            exit 1
          fi

          cd "$DEPLOY_PATH"

          cleanup() {
            rm -f .env
          }
          trap cleanup EXIT

          echo "[deploy] Actualizando código desde origin/main..."
          git fetch origin main
          git reset --hard origin/main

          echo "[deploy] Generando .env temporal con permisos 600..."
          (
            umask 077
            printf '%s\n' "$ENV_PROD" | tr -d '\r' > .env
          )
          chmod 600 .env

          mkdir -p data/app

          # Libera el puerto si existia el contenedor legado masivos-caddy antes de reasignarlo a app
          docker rm -f masivos-caddy >/dev/null 2>&1 || true

          echo "[deploy] Reconstruyendo y levantando contenedores..."
          docker compose up -d --build --remove-orphans

          APP_PORT_VAL="$(grep -E '^(APP_PORT|CADDY_PORT)=' .env | tail -n1 | cut -d '=' -f2- || true)"
          APP_PORT_VAL="${APP_PORT_VAL:-8084}"

          echo "[deploy] Eliminando .env del disco..."
          rm -f .env

          echo "[deploy] Limpiando imágenes Docker obsoletas..."
          docker image prune -f

          echo "[deploy] Verificando salud en http://127.0.0.1:${APP_PORT_VAL}/api/health ..."
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${APP_PORT_VAL}/api/health" >/dev/null 2>&1; then
              echo "[deploy] Despliegue exitoso y servicio healthy."
              exit 0
            fi
            sleep 3
          done

          echo "[deploy] ERROR: la aplicación no respondió en /api/health a tiempo." >&2
          docker compose logs --tail=40 app
          exit 1
