name: CD - Deploy a Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en servidor Linux (Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Desplegar con Docker Compose y .env efímero
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/masivos-wsp' }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_PROD" ]; then
            echo "[deploy] ERROR: el secreto ENV_PROD no está configurado o está vacío." >&2
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "[deploy] ERROR: no se encontró el repositorio Git en $DEPLOY_PATH (ajusta la variable DEPLOY_PATH si usas otra ruta)." >&2
            exit 1
          fi

          cd "$DEPLOY_PATH"

          cleanup() {
            rm -f .env
          }
          trap cleanup EXIT

          echo "[deploy] Actualizando código desde origin/main..."
          git fetch origin main
          git reset --hard origin/main

          echo "[deploy] Generando .env temporal con permisos 600..."
          (
            umask 077
            printf '%s\n' "$ENV_PROD" | tr -d '\r' > .env
          )
          chmod 600 .env

          mkdir -p data/app

          echo "[deploy] Reconstruyendo y levantando contenedores..."
          docker compose up -d --build --remove-orphans

          CADDY_PORT_VAL="$(grep -E '^CADDY_PORT=' .env | tail -n1 | cut -d '=' -f2- || true)"
          CADDY_PORT_VAL="${CADDY_PORT_VAL:-8084}"

          echo "[deploy] Eliminando .env del disco..."
          rm -f .env

          echo "[deploy] Limpiando imágenes Docker obsoletas..."
          docker image prune -f

          echo "[deploy] Verificando salud en http://127.0.0.1:${CADDY_PORT_VAL}/api/health ..."
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${CADDY_PORT_VAL}/api/health" >/dev/null 2>&1; then
              echo "[deploy] Despliegue exitoso y servicio healthy."
              exit 0
            fi
            sleep 3
          done

          echo "[deploy] ERROR: la aplicación no respondió en /api/health a tiempo." >&2
          docker compose logs --tail=40 app caddy
          exit 1
