name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, tests, build y Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Ejecutar suite de pruebas
        run: npm test

      - name: Compilar proyecto
        run: npm run build

      - name: Validar docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      - name: Probar build de imagen Docker
        run: docker build -t masivos-wsp-app:ci .
