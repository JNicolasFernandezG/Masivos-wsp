# Configuracion Nginx para exponer Masivos-wsp SOLO en red local
# Copiar a: /etc/nginx/sites-available/masivos-wsp.conf
# Habilitar: sudo ln -s /etc/nginx/sites-available/masivos-wsp.conf /etc/nginx/sites-enabled/
# Probar:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name masivos.local _;

    # Limite acorde para subir planillas .xlsx
    client_max_body_size 10M;

    # Restriccion estricta a red local (ajusta la subred exacta de tu oficina, ej. 192.168.1.0/24)
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;

    # Stream en tiempo real (Server-Sent Events) sin buffering
    location /api/events {
        proxy_pass http://127.0.0.1:4000/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Panel web y API de la aplicacion
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
